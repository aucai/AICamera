name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and APK
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk AICamera.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AICamera-apk
          path: AICamera.apk

      # Every push to the default branch refreshes the "latest" release,
      # so the newest APK is always at the same download page.
      - name: Publish latest release
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest AICamera.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "最新版 AI拍照助手" \
            --notes "自动构建：${GITHUB_SHA::7}。用手机下载 AICamera.apk 安装即可。"
